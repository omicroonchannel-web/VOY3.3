<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOY v3.3 | Neography & Admin</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --primary: #7289da; --text: #e0e0e0; --accent: #f1c40f; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100vh; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 500px; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid #333; border-right: 1px solid #333; position: relative; }
        .screen { display: none; flex-direction: column; height: 100%; }
        .active { display: flex; }
        input, textarea, button, select { background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin: 5px 0; outline: none; width: 100%; box-sizing: border-box; }
        button { background: var(--primary); cursor: pointer; border: none; font-weight: bold; width: auto; }
        button:hover { filter: brightness(1.1); }
        .row { display: flex; gap: 5px; }
        .header { background: #252525; padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; }
        .ava { width: 32px; height: 32px; border-radius: 50%; background: #555; object-fit: cover; }
        .msgs-area { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; background: #333; max-width: 85%; word-break: break-word; position: relative; }
        .msg.my { align-self: flex-end; background: #3f4769; }
        .msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
        .pinned-bar { background: #2c3e50; padding: 8px 15px; border-bottom: 1px solid var(--accent); font-size: 0.9em; display: none; align-items: center; justify-content: space-between; }
        #pua-grid { display: none; grid-template-columns: repeat(6, 1fr); gap: 4px; background: #111; padding: 8px; max-height: 200px; overflow-y: auto; border-top: 1px solid #333; }
        .pua-key { height: 40px; background: #222; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; font-size: 1.2em; }
        .admin-btn { font-size: 0.7em; background: #c0392b; padding: 2px 5px; margin-left: 5px; border-radius: 3px; }
        .pin-btn { background: var(--accent); color: black; }
    </style>
</head>
<body>

<div id="app">
    <div id="scr-auth" class="screen active" style="padding:30px; justify-content: center;">
        <h1 style="text-align:center; color: var(--primary)">VOY v3.3</h1>
        <input id="au-u" placeholder="Логин">
        <input id="au-p" type="password" placeholder="Пароль">
        <div class="row"><button style="flex:1" onclick="auth('login')">ВОЙТИ</button><button style="flex:1; background:#444" onclick="auth('register')">РЕГИСТРАЦИЯ</button></div>
    </div>

    <div id="scr-lobby" class="screen">
        <div class="header"><img id="my-ava-mini" class="ava" onclick="show('scr-profile')"><b id="my-nick-disp">User</b></div>
        <div id="rooms-list" style="flex:1; padding:10px; overflow-y: auto;"></div>
        <div style="padding:10px; border-top:1px solid #333">
            <input id="new-room-title" placeholder="Название комнаты">
            <div class="row">
                <input id="new-room-pass" type="password" placeholder="Пароль (опционально)" style="flex:1">
                <select id="new-room-mode" style="width:100px"><option value="chat">Чат</option><option value="channel">Канал</option></select>
            </div>
            <button onclick="createRoom()" style="width:100%">+ Создать комнату</button>
        </div>
    </div>

    <div id="scr-chat" class="screen">
        <div class="header"><button onclick="show('scr-lobby')">←</button><b id="chat-title">...</b></div>
        <div id="pinned-msg" class="pinned-bar"><span id="pin-text">📌 Закреп: ...</span><button onclick="unpin()" id="unpin-ui" style="padding:2px 8px; font-size:0.8em; display:none">✕</button></div>
        <div id="msgs-cont" class="msgs-area"></div>
        <div id="pua-grid"></div>
        <div style="padding:10px; background:#252525; display:flex; align-items:center; gap:8px">
            <label style="font-size:1.5em; cursor:pointer">📎<input type="file" id="f-upl" hidden onchange="sendFile()"></label>
            <button onclick="togglePUA()">⌨</button>
            <input id="m-in" placeholder="Сообщение..." style="margin:0">
            <button onclick="sendMsg()">➤</button>
        </div>
    </div>

    <div id="scr-profile" class="screen">
        <div class="header"><button onclick="show('scr-lobby')">←</button><b>Профиль</b></div>
        <div style="padding:20px; overflow-y:auto; text-align:center">
            <img id="p-ava-view" style="width:100px; height:100px; border-radius:50%; background:#333; object-fit:cover">
            <input type="file" id="p-ava-file" hidden onchange="previewAva()">
            <button onclick="document.getElementById('p-ava-file').click()">Сменить аватарку</button>
            <textarea id="p-bio" placeholder="О себе..."></textarea>
            <input type="file" id="p-font-upl" accept=".ttf,.otf"><button onclick="uploadFont()" style="background:#27ae60">Загрузить шрифт</button>
            <button onclick="saveProfile()" style="margin-top:20px; width:100%">Сохранить</button>
            <button onclick="logout()" style="background:#c0392b; width:100%">Выйти</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let me = null, curRoom = null;

    function registerUserFont(username, fontPath) {
        if(!fontPath || document.getElementById(`style-${username}`)) return;
        const style = document.createElement('style');
        style.id = `style-${username}`;
        style.innerHTML = `@font-face { font-family: 'font_${username}'; src: url('${fontPath}?v=${Date.now()}'); } .u-font-${username} { font-family: 'font_${username}', sans-serif !important; }`;
        document.head.appendChild(style);
    }

    function auth(type) {
        const u = document.getElementById('au-u').value, p = document.getElementById('au-p').value;
        if(u && p) socket.emit(type, { username: u, password: p });
    }

    socket.on('auth_ok', user => {
        me = user;
        localStorage.setItem('voy_u', user.username);
        localStorage.setItem('voy_p', document.getElementById('au-p').value);
        document.getElementById('my-nick-disp').innerText = me.username;
        document.getElementById('my-ava-mini').src = me.avatar || '';
        if(me.font) registerUserFont(me.username, me.font);
        show('scr-lobby');
    });

    socket.on('update_rooms', rooms => {
        const l = document.getElementById('rooms-list'); l.innerHTML = '';
        Object.values(rooms).forEach(r => {
            const d = document.createElement('div');
            d.style = "padding:12px; margin-bottom:5px; background:#333; border-radius:6px; cursor:pointer";
            d.innerHTML = `<b>${r.mode === 'channel' ? '📢' : '#'} ${r.title}</b> ${r.hasPass ? '🔒' : ''}`;
            d.onclick = () => {
                let pass = r.hasPass ? prompt("Введите пароль от комнаты:") : null;
                curRoom = r.id; socket.emit('join_room', { id: r.id, password: pass });
            };
            l.appendChild(d);
        });
    });

    function createRoom() {
        const t = document.getElementById('new-room-title').value;
        const p = document.getElementById('new-room-pass').value;
        const m = document.getElementById('new-room-mode').value;
        if(t) socket.emit('create_room', { title: t, password: p, mode: m });
    }

    socket.on('room_history', r => {
        document.getElementById('chat-title').innerText = r.title;
        document.getElementById('msgs-cont').innerHTML = '';
        r.msgs.forEach(addMsg);
        updatePinUI(r.pinned);
        show('scr-chat');
    });

    function sendMsg() {
        const txt = document.getElementById('m-in').value;
        if(txt) { socket.emit('send_msg', { roomId: curRoom, text: txt, type: 'text' }); document.getElementById('m-in').value = ''; }
    }

    async function sendFile() {
        const f = document.getElementById('f-upl').files[0];
        if(!f || !curRoom) return;
        const b64 = await toBase64(f);
        socket.emit('send_msg', { roomId: curRoom, file: b64, type: f.type.startsWith('image') ? 'img' : 'file', text: f.name });
    }

    socket.on('new_msg', addMsg);
    socket.on('msg_deleted', id => { const e = document.getElementById(`m-${id}`); if(e) e.remove(); });
    socket.on('update_pin', msg => updatePinUI(msg));

    function addMsg(m) {
        if(m.userFont) registerUserFont(m.user, m.userFont);
        const c = document.getElementById('msgs-cont');
        const d = document.createElement('div');
        d.id = `m-${m.id}`;
        d.className = `msg ${m.user === me.username ? 'my' : ''}`;
        
        let content = m.type === 'img' ? `<img src="${m.file}">` : (m.type === 'file' ? `<a href="${m.file}" download="${m.text}" style="color:var(--primary)">📄 ${m.text}</a>` : `<span class="u-font-${m.user}">${m.text}</span>`);
        
        let adminTools = '';
        if(me.username === m.roomOwner) {
            adminTools = `<button class="admin-btn" onclick="delMsg('${m.id}')">Удалить</button>
                          <button class="admin-btn pin-btn" onclick="pinMsg('${m.id}')">Закрепить</button>`;
        }

        d.innerHTML = `<div style="font-size:0.7em; opacity:0.6"><b>${m.user}</b> ${m.time} ${adminTools}</div>${content}`;
        c.appendChild(d); c.scrollTop = c.scrollHeight;
    }

    function updatePinUI(msg) {
        const bar = document.getElementById('pinned-msg'), txt = document.getElementById('pin-text'), unpinBtn = document.getElementById('unpin-ui');
        if(msg) {
            bar.style.display = 'flex'; txt.innerText = "📌 " + (msg.type === 'text' ? msg.text : "Файл/Фото");
            unpinBtn.style.display = (me.username === msg.roomOwner) ? 'block' : 'none';
        } else { bar.style.display = 'none'; }
    }

    function delMsg(id) { socket.emit('delete_msg', { roomId: curRoom, msgId: id }); }
    function pinMsg(id) { socket.emit('pin_msg', { roomId: curRoom, msgId: id }); }
    function unpin() { socket.emit('pin_msg', { roomId: curRoom, msgId: null }); }

    function togglePUA() { 
        const g = document.getElementById('pua-grid'); 
        if(g.innerHTML === '') {
            for(let i=0; i<60; i++) {
                let char = String.fromCharCode(0xE000 + i);
                let b = document.createElement('div'); b.className = `pua-key u-font-${me.username}`; b.innerText = char;
                b.onclick = () => document.getElementById('m-in').value += char;
                g.appendChild(b);
            }
        }
        g.style.display = g.style.display === 'grid' ? 'none' : 'grid';
    }

    async function uploadFont() {
        const f = document.getElementById('p-font-upl').files[0];
        if(f) socket.emit('save_font_file', { file: await toBase64(f) });
    }

    async function saveProfile() {
        const bio = document.getElementById('p-bio').value, avaSrc = document.getElementById('p-ava-view').src;
        socket.emit('update_profile', { bio, avatar: avaSrc.startsWith('data:') ? avaSrc : null });
    }

    function previewAva() { toBase64(document.getElementById('p-ava-file').files[0]).then(r => document.getElementById('p-ava-view').src = r); }
    function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function logout() { localStorage.clear(); location.reload(); }
    const toBase64 = f => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(f); r.onload = () => res(r.result); r.onerror = e => rej(e); });
    socket.on('error', m => alert(m));
    socket.on('alert', m => alert(m));

    window.onload = () => {
        const u = localStorage.getItem('voy_u'), p = localStorage.getItem('voy_p');
        if(u && p) { document.getElementById('au-u').value = u; document.getElementById('au-p').value = p; auth('login'); }
    }
</script>
</body>
</html>
